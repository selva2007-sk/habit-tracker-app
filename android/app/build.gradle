
plugins {
    id 'com.android.application'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

android {
    namespace = "com.habittacker.app"
    compileSdk = rootProject.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig {
        applicationId "com.habittacker.app"
        minSdkVersion rootProject.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion rootProject.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation fileTree(include: ['*.aar'], dir: 'libs')
    implementation fileTree(include: ['*.aar'], dir: '../capacitor-cordova-android-plugins/src/main/libs')
    implementation "androidx.appcompat:appcompat:${androidxAppCompatVersion ?: '1.7.0'}"
    implementation "androidx.coordinatorlayout:coordinatorlayout:${androidxCoordinatorLayoutVersion ?: '1.3.0'}"
    implementation "androidx.core:core-splashscreen:${coreSplashScreenVersion ?: '1.0.1'}"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:${junitVersion ?: '4.13.2'}"
    androidTestImplementation "androidx.test.ext:junit:${androidxJunitVersion ?: '1.1.5'}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${androidxEspressoCoreVersion ?: '3.5.1'}"
    implementation project(':capacitor-cordova-android-plugins')
}


apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists() && servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    println("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
